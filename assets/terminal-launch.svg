<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Launch xinyan.os</title>
  <desc id="desc">A clickable animated terminal card for Yao Xinyan's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="258" rx="17" fill="none" stroke="#334155"/>
  <circle cx="42" cy="38" r="7" fill="#fb7185"/>
  <circle cx="66" cy="38" r="7" fill="#fbbf24"/>
  <circle cx="90" cy="38" r="7" fill="#34d399"/>
  <text x="480" y="43" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">xinyan.os — personal agent console</text>
  <rect x="32" y="67" width="896" height="1" fill="#334155"/>
  <text x="56" y="116" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">visitor@github:~$</text>
  <text x="290" y="116" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23">launch xinyan.os</text>
  <rect x="56" y="144" width="848" height="2" rx="1" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="56" y="188" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">AI Product Manager · Agent Architecture · Memory Systems</text>
  <text x="56" y="222" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">click to explore →</text>
  <rect x="210" y="203" width="11" height="22" fill="#34d399">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
  <circle cx="886" cy="210" r="8" fill="#34d399" filter="url(#glow)">
    <animate attributeName="r" values="7;10;7" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
